name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # 隐私闸门：防止本机配置/密钥被打进 dist/public/local-assets（CI 上无本机 Key，仅校验文件清单）
      - run: npm run check:privacy --all