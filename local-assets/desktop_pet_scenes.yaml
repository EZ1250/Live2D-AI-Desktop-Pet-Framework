# ============================================================
# 桌宠场景分类配置 v1.0
# 读取说明：
#   1. categories 按数组顺序即优先级，平手时取靠前者
#   2. 命中 meeting 类别的 lock=true 时，跳过所有其他分类
#   3. locked_screen_skip=true 时，锁屏/息屏轮询直接跳过，不调用 MCP
#   4. 所有阈值单位：秒；prompt 中 {var} 会被运行时值替换
# ============================================================

global:
  poll_interval: 30            # 定时触发间隔（秒）
  locked_screen_skip: true     # 锁屏时是否跳过本轮
  idle_threshold_default: 300  # 无键鼠输入超过 N 秒视为"空闲"
  max_prompt_length: 60        # 桌宠单次输出字数上限
  quiet_hours:                 # 深夜收敛时段
    start: "23:00"
    end: "07:00"
    tone: "克制、简短，不主动开启新话题"

categories:

  - id: meeting
    name: 会议沟通
    lock: true                 # 命中即锁定，不再评估其他类别
    signals:
      processes: [zoom, teams, wechat, qq, "tencent meeting", feishu, lark]
      title_keywords_any: ["通话中", "会议中", "共享中", "屏幕共享", "直播中"]
    rules:
      speak: never             # 会中不主动发言
      post_meeting_reminder: true   # 会议结束后可提醒一次
      cooldown: 1800           # 会后提醒冷却（秒）
    prompt: |
      用户刚结束会议（时长约 {meeting_duration} 分钟）。
      用一句话关心一下，并可提及其日程中的下一事项；若无下一事项则只问候。

  - id: system_alert
    name: 系统异常
    signals:
      cpu_over: 90             # CPU 占用超过 90% 持续 {cpu_duration} 秒
      cpu_duration: 60
      not_responding: true     # 有"未响应"窗口
    rules:
      speak: once              # 每异常事件只提示一次
      cooldown: 600
    prompt: |
      检测到系统异常（{alert_detail}）。
      极简提示用户一句，询问是否需要帮助；用户无回应则不再追问。

  - id: production
    name: 生产创作
    signals:
      processes_any: [code, idea, cursor, vscode, winword, excel, powerpnt, photoshop, premiere, figma, blender]
      title_keywords_any: ["*.* - ", ".docx", ".xlsx", ".psd", ".prproj"]   # 含文件名的窗口标题
    rules:
      speak: rare              # 默认安静陪伴
      trigger_conditions:
        - "同一窗口反复出现错误关键词（如 error/failed/崩溃）达 3 次"
        - "前台应用无响应超过 {hang_seconds} 秒"
      hang_seconds: 30
      cooldown: 1800
    prompt: |
      用户正在专注{detected_app}（窗口标题：{window_title}）。
      检测到{issue_detail}。提出可选的解决方案或建议。

  - id: im_chat
    name: 即时通讯
    signals:
      processes_any: [wechat, qq, slack, telegram]
      window_switch_freq: high  # 短时高频切换窗口
    rules:
      speak: rare
      trigger_conditions:
        - "IM 窗口前台停留超过 {dwell_seconds} 秒且无新输入"   # 可能在等回复、发呆
      dwell_seconds: 120
      cooldown: 900
    prompt: |
      用户停留在聊天窗口已 {dwell_seconds} 秒没有输入。
      可轻量接一句话（关心或闲聊），一句即止。

  - id: learning
    name: 学习阅读
    signals:
      title_keywords_any: ["课程", "教程", "lecture", "tutorial", "第X讲", ".pdf", "论文", "网课"]
      url_patterns_any: ["mooc", "bilibili.com/video/BV.*(课程|教程)", "coursera", "edx"]
    rules:
      speak: rare
      trigger_conditions:
        - "连续学习超过 {long_session} 分钟"
      long_session: 50
      cooldown: 1800
    prompt: |
      用户已持续学习约 {active_duration} 分钟。
      温和提醒休息一次（活动肩颈、远眺），语气不说教。

  - id: browsing
    name: 信息浏览
    signals:
      processes_any: [chrome, firefox, edge, safari]
      url_patterns_any: ["google.com/search", "bing.com/search", "zhihu.com/question", "news"]
    rules:
      speak: rare
      trigger_conditions:
        - "连续浏览超过 {long_browse} 分钟且无输入"
      long_browse: 45
      cooldown: 2400
    prompt: |
      用户已连续浏览约 {active_duration} 分钟。
      提醒起身活动一次；若深夜时段则改为一句简短关怀。

  - id: entertainment
    name: 娱乐消遣
    signals:
      processes_any: [potplayer, vlc, spotify, netease, steam, "league of legends"]
      url_patterns_any: ["youtube.com", "bilibili.com", "douyin.com", "weibo.com", "reddit.com"]
      fullscreen: ignore_prompt # 全屏时不弹任何提示
    rules:
      speak: normal
      trigger_conditions:
        - "连续娱乐超过 {long_play} 分钟"
      long_play: 60
      cooldown: 1200
    prompt: |
      用户正在{detected_activity}约 {active_duration} 分钟。
      可顺势闲聊，语气活泼但不超过一句。

  - id: daily_chores
    name: 日常事务
    signals:
      url_patterns_any: ["taobao", "jd.com", "bank", "gov.cn", "12306", "booking"]
    rules:
      speak: rare
      trigger_conditions:
        - "页面停留超过 {dwell_seconds} 秒且用户离开（无输入）超过 {away_seconds} 秒"  # 怕遗忘未提交的表单
      dwell_seconds: 180
      away_seconds: 300
      cooldown: 3600
    prompt: |
      用户的{page_type}页面已停留较久且人暂时离开。
      轻声提醒，一句即止。

  - id: file_organizing
    name: 系统杂务
    signals:
      processes_any: [explorer, download]
    rules:
      speak: never
      cooldown: 3600
    prompt: ""                 # 不配置提示词，永不触发

  - id: idle
    name: 空闲离开
    signals:
      no_input_seconds: 300      # 默认继承 global.idle_threshold_default
      locked: false            # 锁屏由 global.locked_screen_skip 处理
    rules:
      speak: normal
      greeting_times: ["first_idle_of_day", "after_long_work"]  # 刚空闲时问候，而非每次都问
      cooldown: 3600
    prompt: |
      用户已离开约 {idle_duration} 分钟。
      主动问候一次（如"欢迎回来"），可提议休息或整理桌面；深夜时段语气收敛。

